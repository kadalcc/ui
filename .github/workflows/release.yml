name: Release

# The CLI (`@kadal/ui`, packages/cli) is the one thing published from here. The registry is
# static JSON on ui.kadal.cc and goes out with deploy.yml; its versions are `meta.version` in
# apps/www/registry.json and the root CHANGELOG.md, not npm's.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) and provenance
  actions: write # start CI on the "Version packages" branch (below)

jobs:
  release:
    if: github.repository == 'kadalcc/ui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (npm >= 11.5.1) trades this job's GitHub OIDC token for a short-lived npm
      # one, so no npm token is stored anywhere; @kadal/ui lists kadalcc/ui + release.yml as its
      # trusted publisher on npmjs.com. Staged publishing needs npm >= 11.15.0.
      - run: npm install -g npm@^11.15.0
      - run: bun install --frozen-lockfile
      # Only the packages: the site is CI's and deploy.yml's business, and building it here would
      # make every release wait on Astro.
      - run: bun run --filter './packages/*' build
      - run: bun run --filter './packages/*' test
      # Opens a "Version packages" PR while changesets are pending; once that PR is merged,
      # publishes every changed package to npm with provenance.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: bunx changeset version
          publish: bun run release
          title: "Version packages"
          commit: "Version packages"
          # One release per version (the step below), not one per package.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tools/publish.mjs: `direct` (npm publish) unless the repo variable says `stage`.
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE || 'direct' }}
          # Only for bootstrapping a package that doesn't exist on npm yet: `npm stage publish` with
          # an ordinary (2FA-respecting) token, approved on npmjs.com. Unset otherwise; npm uses
          # trusted publishing (OIDC) first whenever the package has a trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # The "Version packages" PR is opened and pushed with GITHUB_TOKEN, which starts no workflow
      # by itself: its pull_request run sits waiting for a maintainer's approval, and fails when the
      # PR moves on unapproved. A dispatch is the one event GITHUB_TOKEN may start, so CI runs on
      # the branch as it now stands and its checks land on the PR's head commit.
      - if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.published != 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The GitHub release v<version>, with the changelog entry and the package that went out.
      - if: steps.changesets.outputs.published == 'true'
        run: node tools/github-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
